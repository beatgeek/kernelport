name: Teardown Lambda Cloud Resources
on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: Instance ID to terminate
        required: true
      filesystem_id:
        description: Filesystem ID (required if deletion selected)
        required: false
      delete_filesystem:
        description: Delete this filesystem permanently after detachment
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Terminate, wait for detachment, and optionally delete
        env:
          LAMBDA_CLOUD_API_KEY: ${{ secrets.LAMBDA_CLOUD_API_KEY }}
          INSTANCE_ID: ${{ inputs.instance_id }}
          FILESYSTEM_ID: ${{ inputs.filesystem_id }}
          DELETE_FILESYSTEM: ${{ inputs.delete_filesystem }}
        run: python3 scripts/lambda/resources.py teardown
      - name: Save confirmed cleanup status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lambda-teardown-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/resources.json
