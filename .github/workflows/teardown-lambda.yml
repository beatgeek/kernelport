# Teardown KernelPort (LuxTTS) on Lambda Cloud: terminate instance, delete filesystem.
# Trigger: workflow_dispatch. Requires repository secret: LAMBDA_CLOUD_API_KEY.
name: Teardown Lambda Cloud Resources

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "Lambda instance ID to terminate"
        required: true
      filesystem_id:
        description: "Filesystem ID to delete (optional)"
        required: false
      delete_filesystem:
        description: "Delete filesystem if filesystem_id provided"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  LAMBDA_API_BASE: "https://cloud.lambdalabs.com/api/v1"

jobs:
  teardown:
    runs-on: ubuntu-latest
    steps:
      - name: Terminate instance
        continue-on-error: true
        run: |
          id="${{ github.event.inputs.instance_id }}"
          curl -sSf -u "${{ secrets.LAMBDA_CLOUD_API_KEY }}:" \
            -X POST "${{ env.LAMBDA_API_BASE }}/instance-operations/terminate" \
            -H "Content-Type: application/json" \
            -d "{\"instance_ids\":[\"$id\"]}" | jq .

      - name: Delete filesystem
        if: always() && github.event.inputs.delete_filesystem == 'true' && github.event.inputs.filesystem_id != ''
        run: |
          raw_fs_id="${{ github.event.inputs.filesystem_id }}"
          # Trim leading/trailing whitespace from the filesystem ID.
          fs_id="$(echo "$raw_fs_id" | xargs)"

          if [ -z "$fs_id" ]; then
            echo "No valid filesystem_id provided after trimming; skipping filesystem deletion."
            exit 0
          fi

          # Validate expected pattern, e.g. 'fs_...'.
          if ! echo "$fs_id" | grep -Eq '^fs_[A-Za-z0-9]+$'; then
            echo "Invalid filesystem_id '$fs_id'; expected pattern 'fs_...'. Skipping filesystem deletion."
            exit 0
          fi

          curl -sSf -u "${{ secrets.LAMBDA_CLOUD_API_KEY }}:" \
            -X DELETE "${{ env.LAMBDA_API_BASE }}/filesystems/$fs_id" | jq . || echo "Note: filesystem deletion can fail until the instance is fully terminated and detached."

      - name: Summary
        run: |
          instance_id="${{ github.event.inputs.instance_id }}"
          raw_fs_id="${{ github.event.inputs.filesystem_id }}"
          fs_id="$(echo "$raw_fs_id" | xargs)"

          echo "## Lambda Cloud teardown" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Instance ID**: $instance_id" >> $GITHUB_STEP_SUMMARY
          if [ -n "$fs_id" ]; then
            echo "- **Filesystem ID**: $fs_id" >> $GITHUB_STEP_SUMMARY
            echo "- **Filesystem deleted**: ${{ github.event.inputs.delete_filesystem }}" >> $GITHUB_STEP_SUMMARY
          fi
