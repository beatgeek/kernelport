name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
      - name: install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ONNX Runtime
        run: |
          pip install onnxruntime==1.22.0
          python - <<'PYTHON'
          import onnxruntime, os
          from pathlib import Path
          capi = Path(onnxruntime.__file__).parent / 'capi'
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"ORT_LIB_LOCATION={capi}\n")
              f.write(f"ORT_DYLIB_PATH={next(capi.glob('libonnxruntime.so*'))}\n")
          PYTHON

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all

      - name: build
        run: cargo build --all

  ort-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
      - name: install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ONNX Runtime
        run: |
          pip install onnxruntime==1.22.0
          python - <<'PYTHON'
          import onnxruntime, os
          from pathlib import Path
          capi = Path(onnxruntime.__file__).parent / 'capi'
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"ORT_LIB_LOCATION={capi}\n")
              f.write(f"ORT_DYLIB_PATH={next(capi.glob('libonnxruntime.so*'))}\n")
          PYTHON

      - name: ort identity (cpu)
        run: cargo test -p kernelport-backend-ort --test identity

  python-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install PyYAML
        run: pip install pyyaml

      - name: manifest_to_serve_args tests
        run: python tests/test_manifest_serve_args.py

  inference-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          pip install -r scripts/validation/requirements.txt onnxruntime==1.22.0 pyyaml
          python - <<'PYTHON'
          import onnxruntime, os
          from pathlib import Path
          capi = Path(onnxruntime.__file__).parent / 'capi'
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"ORT_LIB_LOCATION={capi}\n")
              f.write(f"ORT_DYLIB_PATH={next(capi.glob('libonnxruntime.so*'))}\n")
          PYTHON
      - name: Lifecycle and inference regressions
        run: |
          python tests/test_lambda_resources.py
          cargo build --locked -p kernelport-server
          python tests/test_inference_e2e.py
      - name: Validate workflow scripts
        run: |
          bash -n scripts/lambda/remote.sh scripts/lambda/run-stack.sh
          git diff --exit-code

  gpu-image:
    # Building a CUDA image needs no GPU: the CUDA libraries are just files in
    # the base image, and a GPU is only required to execute kernels. This job
    # therefore runs on a stock runner with no secrets and no cloud spend.
    #
    # What it proves: the image assembles, and the `kernelportd --help` step in
    # Dockerfile.gpu executes the release binary against the runtime image's
    # glibc on amd64. That is the check that catches a build/runtime base
    # mismatch, which is otherwise only discovered by a manual Lambda deploy.
    #
    # What it does not prove: ONNX Runtime CUDA execution provider startup or
    # any inference. Both need a real device; see the Lambda validation runbook.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          platforms: linux/amd64
          push: false
          # Shares the deploy workflow's cache scope, so a CI build warms the
          # release build and vice versa.
          cache-from: type=gha,scope=kernelport
          cache-to: type=gha,scope=kernelport,mode=max
