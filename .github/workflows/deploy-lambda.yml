name: Deploy to Lambda Cloud
on:
  workflow_dispatch:
    inputs:
      instance_type_name:
        description: Lambda GPU type (x86_64 host with Docker and NVIDIA Container Toolkit)
        required: true
        default: gpu_1x_a100
      region_name:
        description: Lambda region
        required: true
        default: us-tx-1
      ssh_key_name:
        description: Lambda SSH key matching LAMBDA_SSH_PRIVATE_KEY
        required: true
      filesystem_id:
        description: Optional existing filesystem ID (always retained)
        required: false
      validation_mode:
        description: Correctness test and benchmark workload
        type: choice
        options: [softmax, luxtts]
        default: softmax
      retain_instance:
        description: Keep instance after successful validation (failures always clean up)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lambda-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      kernelport_digest: ${{ steps.kernelport.outputs.digest }}
      worker_digest: ${{ steps.worker.outputs.digest }}
      owner: ${{ steps.names.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate required configuration before building or allocating
        env:
          LAMBDA_KEY: ${{ secrets.LAMBDA_CLOUD_API_KEY }}
          SSH_KEY: ${{ secrets.LAMBDA_SSH_PRIVATE_KEY }}
          HF_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
          PROMPT: ${{ secrets.LUXTTS_PROMPT_WAV_BASE64 }}
          MODE: ${{ inputs.validation_mode }}
        run: |
          test -n "$LAMBDA_KEY" && test -n "$SSH_KEY"
          if [ "$MODE" = luxtts ]; then test -n "$HF_TOKEN" && test -n "$PROMPT"; fi
      - id: names
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build KernelPort
        id: kernelport
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.names.outputs.owner }}/kernelport:gpu-${{ github.sha }}
          cache-from: type=gha,scope=kernelport
          cache-to: type=gha,scope=kernelport,mode=max
      - name: Build selected worker
        id: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.validation_mode == 'luxtts' && 'Dockerfile.luxtts' || 'Dockerfile.helion' }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.names.outputs.owner }}/kernelport-worker:${{ inputs.validation_mode }}-${{ github.sha }}
          cache-from: type=gha,scope=worker-${{ inputs.validation_mode }}
          cache-to: type=gha,scope=worker-${{ inputs.validation_mode }},mode=max
  validate:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    env:
      LAMBDA_CLOUD_API_KEY: ${{ secrets.LAMBDA_CLOUD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Provision instance and filesystem
        id: provision
        env:
          REGION_NAME: ${{ inputs.region_name }}
          INSTANCE_TYPE_NAME: ${{ inputs.instance_type_name }}
          SSH_KEY_NAME: ${{ inputs.ssh_key_name }}
          FILESYSTEM_ID: ${{ inputs.filesystem_id }}
        run: python3 scripts/lambda/resources.py provision
      - name: Save resource IDs immediately, including on provision failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lambda-resource-ids-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/resources.json
          if-no-files-found: warn
      - name: Start stack, validate outputs, and benchmark
        env:
          LAMBDA_SSH_PRIVATE_KEY: ${{ secrets.LAMBDA_SSH_PRIVATE_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
          LUXTTS_PROMPT_WAV_BASE64: ${{ secrets.LUXTTS_PROMPT_WAV_BASE64 }}
          VALIDATION_MODE: ${{ inputs.validation_mode }}
          IMAGE_OWNER: ${{ needs.build-push.outputs.owner }}
          SERVER_DIGEST: ${{ needs.build-push.outputs.kernelport_digest }}
          WORKER_DIGEST: ${{ needs.build-push.outputs.worker_digest }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          owner = os.environ['IMAGE_OWNER']
          Path('images.json').write_text(json.dumps({
            'kernelport': f"ghcr.io/{owner}/kernelport@{os.environ['SERVER_DIGEST']}",
            'worker': f"ghcr.io/{owner}/kernelport-worker@{os.environ['WORKER_DIGEST']}",
            'mode': os.environ['VALIDATION_MODE'], 'commit': os.environ['GITHUB_SHA'],
          }))
          PY
          bash scripts/lambda/remote.sh
      - name: Clean resources after failure or successful ephemeral run
        if: ${{ !cancelled() && (failure() || !inputs.retain_instance) }}
        run: python3 scripts/lambda/resources.py cleanup
      - name: Save validation results and actual cleanup outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lambda-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: error
      - name: Summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('results/resources.json')
          state = json.loads(p.read_text()) if p.exists() else {}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
            f.write('## Lambda validation\n\n')
            for key in ('commit', 'instance_id', 'instance_ip', 'filesystem_id', 'filesystem_created', 'instance_terminated', 'filesystem_deleted', 'cleanup_errors'):
              f.write(f'- **{key}**: {state.get(key, "not confirmed")}\n')
            f.write('\nDownload the validation artifact for benchmark JSON, logs, and GPU samples. Cancelled runs require manual teardown using the resource-ID artifact or Lambda console.\n')
          PY
